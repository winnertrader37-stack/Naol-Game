<!DOCTYPE html>
<html lang="om"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Naol Game</title>
<style>
:root{--g:#fcc419;--r:#e03131;--n:#2f9e44;--bg:rgba(8,12,8,.6)}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Verdana,sans-serif;color:#fff;touch-action:none;user-select:none}
canvas{display:block}
#hud{position:fixed;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;pointer-events:none}
.box{background:var(--bg);border:2px solid var(--g);border-radius:12px;padding:6px 12px}
#spd{font-size:36px;font-weight:700;line-height:1}
#rpm{height:6px;background:#333;margin-top:6px}#rpmb{height:100%;width:0;background:linear-gradient(90deg,var(--n),var(--g),var(--r))}
#cams{position:fixed;top:78px;right:10px;display:flex;flex-direction:column;gap:6px}
button{background:var(--bg);color:#fff;border:2px solid var(--g);border-radius:10px;padding:8px 12px;font-size:13px;font-family:inherit}
button.on{background:var(--g);color:#000}
.tc{position:fixed;bottom:18px;display:flex;gap:12px}
.tc button{width:72px;height:72px;font-size:26px}
#start{position:fixed;inset:0;background:linear-gradient(180deg,#2f9e44 0 33%,#fcc419 33% 66%,#e03131 66%);display:flex;align-items:center;justify-content:center}
#card{background:rgba(0,0,0,.82);padding:28px;border-radius:18px;text-align:center;display:flex;flex-direction:column;gap:14px;max-width:320px}
#card h1{margin:0;font-size:40px;color:var(--g)}
#card small{opacity:.8;line-height:1.5}
#stats{position:fixed;left:10px;top:112px;width:130px;font-size:11px;padding:6px 8px;pointer-events:none}
.sr{margin:3px 0}.sr i{display:block;height:5px;background:#333}.sr b{display:block;height:100%;background:var(--g);width:0}
#mm{position:fixed;right:10px;bottom:104px;width:100px;height:100px;border:2px solid var(--g);border-radius:10px}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:5}
#mp{background:#111;border:2px solid var(--g);border-radius:16px;padding:16px;width:290px;display:flex;flex-direction:column;gap:10px;text-align:center}
#mt,#mc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
</style></head><body>
<div id="hud"><div class="box"><div id="spd">0</div><small>km/h &nbsp; Gear <b id="gr">N</b></small><div id="rpm"><div id="rpmb"></div></div></div><div class="box" id="ttl"></div></div>
<div id="cams"></div>
<div class="tc" style="left:14px"><button data-t="l">◀</button><button data-t="r">▶</button></div>
<div class="tc" style="right:14px"><button data-t="b">■</button><button data-t="g">▲</button></div>
<div class="box" id="stats"><div id="sc"></div></div><canvas id="mm" width="100" height="100"></canvas>
<div id="menu"><div id="mp"><div id="mt"></div><div id="mc"></div><button id="mx">Cufi</button></div></div>
<div id="start"><div id="card"><h1 id="t"></h1>
<small>Finfinnee · Leopard 8<br>W A S D / xiyyaa · Space = birkii · C = kaameraa</small>
<button id="go">Jalqabi</button>
<button id="up">Fakkii kee olkaa'i</button><input id="file" type="file" accept="image/*" hidden></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TITLE="Naol Game"; // maqaa game asitti jijjiiri
document.title=TITLE;t.textContent=TITLE;ttl.textContent=TITLE;
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.outputEncoding=THREE.sRGBEncoding;
document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x8ecae6);S.fog=new THREE.Fog(0x8ecae6,150,900);
const cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1400);
S.add(new THREE.HemisphereLight(0xffffff,0x6b7a3a,.95));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(60,120,40);S.add(sun);
const M=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
const box=(w,h,d,m,x,y,z,p)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);(p||S).add(o);return o};
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- Finfinnee (Addis Ababa) low-poly ---------- */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),M(0x7a8f3a));ground.rotation.x=-Math.PI/2;S.add(ground);
const road=M(0x2b2b2e),pal=[0xe9d8a6,0xd4a373,0xcfd8dc,0xb08968,0xf1faee,0xa8dadc];
for(let i=-5;i<=5;i++){box(12,.05,720,road,i*60,.03,0);box(720,.05,12,road,0,.03,i*60)}
const BL=[];
for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++){
 if(!i&&!j)continue;
 const cx=i*60+30,cz=j*60+30,n=3+Math.floor(Math.random()*3);
 for(let k=0;k<n;k++){const w=rnd(8,16),d=rnd(8,16),h=Math.random()<.2?rnd(30,60):rnd(6,22);
  const bx=cx+rnd(-16,16),bz=cz+rnd(-16,16);BL.push([bx,bz,w/2,d/2]);box(w,h,d,M(pal[Math.floor(Math.random()*pal.length)]),bx,h/2,bz)}}
// Meskel Square landmark: flag-colour tower on the plaza
[[0x2f9e44,0],[0xfcc419,8],[0xe03131,16]].forEach(([c,y])=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,8,16),M(c));m.position.set(30,y+4,30);S.add(m)});
// eucalyptus trees + hills outside the city
for(let i=0;i<260;i++){const a=rnd(0,6.28),r=rnd(340,800),x=Math.cos(a)*r,z=Math.sin(a)*r;
 const tr=new THREE.Mesh(new THREE.CylinderGeometry(.4,.6,10,6),M(0x6d4c41));tr.position.set(x,5,z);S.add(tr);
 const lf=new THREE.Mesh(new THREE.ConeGeometry(3,12,7),M(0x2d6a4f));lf.position.set(x,15,z);S.add(lf)}
for(let i=0;i<18;i++){const a=i/18*6.28+rnd(-.1,.1),r=rnd(900,1150),h=rnd(90,200);
 const m=new THREE.Mesh(new THREE.ConeGeometry(rnd(120,200),h,7),M(0x6a994e));m.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);S.add(m)}

/* ---------- Leopard 8 ---------- */
const car=new THREE.Group();S.add(car);
const body=new THREE.MeshPhongMaterial({color:0x0b0b0d,shininess:90}),
 silver=new THREE.MeshPhongMaterial({color:0xb8bcc4,shininess:80}),
 glass=M(0x1b2a36,{transparent:true,opacity:.35}),dark=M(0x111111);
box(2.1,.9,4.7,body,0,.9,0,car);                 // lower body
box(1.95,.85,3.0,glass,0,1.75,-.4,car);          // glass cabin
box(2.0,.1,3.1,body,0,2.2,-.4,car);              // roof
box(2.1,.08,.3,silver,0,2.3,-.4,car);            // roof rail
box(1.2,.12,.12,M(0x4dabf7,{emissive:0x1971c2}),0,2.33,1.0,car); // blue roof light
box(1.95,.18,.7,body,0,1.38,1.75,car).rotation.x=0; // hood
box(1.5,.5,.06,dark,0,.95,2.37,car);             // grille
box(1.4,.06,.07,silver,0,1.12,2.38,car);
[-1,1].forEach(s=>{
 box(.4,.18,.06,new THREE.MeshBasicMaterial({color:0xfff6c8}),s*.8,1.1,2.37,car);   // headlights
 box(.18,.4,.06,new THREE.MeshBasicMaterial({color:0xff2a2a}),s*.95,1.1,-2.37,car); // tail lights
 box(.06,.14,2.3,silver,s*1.06,.52,0,car);                                           // side sills
});
box(1.7,.14,.35,silver,0,.5,2.25,car);box(1.7,.14,.35,silver,0,.5,-2.25,car);        // skid plates
// spare tyre on tailgate
const spare=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.3,20).rotateX(Math.PI/2),M(0x151515));spare.position.set(0,1.35,-2.55);car.add(spare);
const hub=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.32,12).rotateX(Math.PI/2),silver);hub.position.copy(spare.position);car.add(hub);
// wheels
const wheels=[];
[[-1,1.5],[1,1.5],[-1,-1.5],[1,-1.5]].forEach(([sx,z],i)=>{
 const piv=new THREE.Group();piv.position.set(sx*1.05,.47,z);car.add(piv);
 const spin=new THREE.Group();piv.add(spin);
 spin.add(new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.36,20).rotateZ(Math.PI/2),M(0x151515)));
 spin.add(new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.38,16).rotateZ(Math.PI/2),silver));
 [0,1.05,2.1].forEach(a=>{const sp=box(.4,.07,.58,dark,0,0,0,spin);sp.rotation.x=a});
 wheels.push({piv,spin,front:z>0});});
// driver (left-hand drive) with face texture
const drv=new THREE.Group();drv.position.set(.5,0,-.15);car.add(drv);
box(.55,.12,.55,dark,0,.98,0,drv);box(.55,.75,.12,dark,0,1.35,-.32,drv);
box(.5,.6,.3,M(0xf1f1f1),0,1.35,-.08,drv);
const skin=M(0x6b3f2a),faceMat=M(0x8a5a3c);
const head=new THREE.Mesh(new THREE.SphereGeometry(.17,20,16),skin);head.scale.set(1,1.2,1);head.position.set(0,1.82,-.08);drv.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.19,20,12,0,6.3,0,1.75),M(0x0c0c0c));hair.position.set(0,1.85,-.09);drv.add(hair);
const fp=new THREE.Mesh(new THREE.PlaneGeometry(.31,.35),faceMat);fp.position.set(0,1.8,.12);drv.add(fp);
function setFace(src){new THREE.TextureLoader().load(src,tx=>{tx.encoding=THREE.sRGBEncoding;faceMat.map=tx;faceMat.color.set(0xffffff);faceMat.needsUpdate=true})}
setFace('face.jpg');
const wheelSt=new THREE.Mesh(new THREE.TorusGeometry(.17,.025,8,20),dark);wheelSt.position.set(.5,1.5,.55);wheelSt.rotation.x=-1.1;car.add(wheelSt);
box(1.8,.3,.45,dark,0,1.35,.85,car);              // dashboard
file.onchange=e=>{const f=e.target.files[0];if(f)setFace(URL.createObjectURL(f))};
up.onclick=()=>file.click();

/* ---------- controls ---------- */
const k={},T={};let cm=0,yaw=0,pit=.35;
addEventListener('keydown',e=>{k[e.code]=1;if(e.code=='KeyC')setCam((cm+1)%5)});
addEventListener('keyup',e=>k[e.code]=0);
document.querySelectorAll('[data-t]').forEach(b=>{const t=b.dataset.t;
 b.onpointerdown=e=>{T[t]=1;e.preventDefault()};['pointerup','pointerleave','pointercancel'].forEach(n=>b['on'+n]=()=>T[t]=0)});
const names=['Duubaa','Fuula','Keessa','Olii','Naannoo'],cb=[];
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>setCam(i);cams.append(b);cb.push(b)});
function setCam(i){cm=i;cb.forEach((b,j)=>b.classList.toggle('on',j==i))}setCam(0);
let drag=0;R.domElement.onpointerdown=e=>{drag=1;if(cm!=4)return};
addEventListener('pointerup',()=>drag=0);
addEventListener('pointermove',e=>{if(drag&&cm==4){yaw-=e.movementX*.01;pit=Math.max(.05,Math.min(1.3,pit+e.movementY*.01))}});

/* ---------- engine sound ---------- */
let ac,o1,o2,gn,fl;
go.onclick=()=>{start.style.display='none';paused=false;
 try{ac=new(window.AudioContext||window.webkitAudioContext)();o1=ac.createOscillator();o2=ac.createOscillator();gn=ac.createGain();fl=ac.createBiquadFilter();
 o1.type='sawtooth';o2.type='square';fl.type='lowpass';gn.gain.value=0;o1.connect(fl);o2.connect(fl);fl.connect(gn);gn.connect(ac.destination);o1.start();o2.start()}catch(e){}};

/* ---------- v2: baadiyyaa, traffic, leopard, coins, menu ---------- */
let paused=true,hp=100,score=0,got=0,foc=100,cd=0,ph=0;
// baadiyyaa: dirt road + tukul huts
box(10,.05,640,M(0x8d6e4c),0,.04,680);
for(let i=0;i<40;i++){const hx=(Math.random()<.5?-1:1)*rnd(12,45),hz=rnd(380,980);
 const a=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.4,2.2,10),M(0xe0c9a0));a.position.set(hx,1.1,hz);S.add(a);
 const b=new THREE.Mesh(new THREE.ConeGeometry(3.3,2.4,10),M(0x8a6a3a));b.position.set(hx,3.4,hz);S.add(b)}
// traffic
function mkCar(c){const g=new THREE.Group();box(1.9,.8,4.2,M(c),0,.8,0,g);box(1.7,.7,2.2,M(0x222a30),0,1.5,-.2,g);
 [[-.9,1.5],[.9,1.5],[-.9,-1.5],[.9,-1.5]].forEach(([a,b])=>box(.3,.7,.7,dark,a,.35,b,g));S.add(g);return g}
const tr=[];for(let i=0;i<14;i++){const o={a:i%2,d:Math.random()<.5?-1:1,r:Math.floor(rnd(-4,5)),s:rnd(-340,340),sp:rnd(8,16),g:mkCar([0xe03131,0xfcc419,0xf1f1f1,0x1971c2,0x868e96][i%5])};
 o.g.rotation.y=o.a?o.d*Math.PI/2:(o.d>0?0:Math.PI);tr.push(o)}
// coins
const coins=[];function place(c){const r=Math.floor(rnd(-4,5))*60,p=rnd(-300,300);Math.random()<.5?c.position.set(r,1.4,p):c.position.set(p,1.4,r)}
for(let i=0;i<25;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,.2,16).rotateX(Math.PI/2),new THREE.MeshBasicMaterial({color:0xffd43b}));place(c);S.add(c);coins.push(c)}
// leopard companion
const lp=new THREE.Group(),lm=M(0xd9a441),sp=M(0x2b1d0e);
box(.5,.55,1.5,lm,0,.8,0,lp);box(.42,.4,.5,lm,0,1,.95,lp);box(.12,.12,1,lm,0,.95,-1.1,lp).rotation.x=-.5;
for(let i=0;i<10;i++)box(.08,.12,.12,sp,i%2?.26:-.26,rnd(.65,1),rnd(-.6,.6),lp);
const legs=[[-.18,.5],[.18,.5],[-.18,-.5],[.18,-.5]].map(([a,b])=>box(.14,.55,.14,lm,a,.28,b,lp));
lp.scale.setScalar(1.4);lp.position.set(5,0,-50);S.add(lp);
// stat bars + minimap
['Strength','Speed','Focus','Success'].forEach(n=>stats.insertAdjacentHTML('beforeend',`<div class=sr>${n}<i><b id=sb${n}></b></i></div>`));
const mg=mm.getContext('2d');
// menu
const A={col:c=>body.color.set(c),lp:()=>lp.visible=!lp.visible,snd:()=>{if(ac)ac.state=='running'?ac.suspend():ac.resume()},
 tp:(a,b)=>{x=a;z=b;h=0;v=0;mx.click()},tab:n=>{mc.innerHTML=TB[n]()}};
const TB={Character:()=>`<button onclick="up.click()">Fakkii kee olkaa'i</button>`,
 Vehicle:()=>[['Gurraacha',0x0b0b0d],['Adii',0xf1f1f1],['Diimaa',0xc92a2a],['Magariisa',0x2f9e44],['Cuquliisa',0x1971c2]].map(([n,c])=>`<button onclick="A.col(${c})">${n}</button>`).join(''),
 Leopard:()=>`<button onclick="A.lp()">Leopard ON / OFF</button>`,
 Map:()=>`<button onclick="A.tp(0,-40)">Finfinnee</button><button onclick="A.tp(0,420)">Baadiyyaa</button>`,
 Settings:()=>`<button onclick="A.snd()">Sagalee ON / OFF</button>`};
mt.innerHTML=Object.keys(TB).map(n=>`<button onclick="A.tab('${n}')">${n}</button>`).join('');
const mb=document.createElement('button');mb.textContent='☰ Menu';cams.append(mb);
mb.onclick=()=>{menu.style.display='flex';paused=true;A.tab('Character')};
mx.onclick=()=>{menu.style.display='none';paused=false};
function hit(p){if(cd>0){v*=.9;return}cd=.8;hp-=p;v*=-.3}
function game(dt){
 cd-=dt;ph+=dt;
 BL.forEach(([bx,bz,hw,hd])=>{const ox=hw+1.6-Math.abs(x-bx),oz=hd+1.6-Math.abs(z-bz);
  if(ox>0&&oz>0){if(ox<oz)x+=Math.sign(x-bx)*ox;else z+=Math.sign(z-bz)*oz;hit(Math.min(25,Math.abs(v)*.6))}});
 tr.forEach(o=>{o.s+=o.d*o.sp*dt;if(Math.abs(o.s)>360)o.s=-o.s;const l=(o.a?1:-1)*o.d*3+o.r*60;
  o.g.position.set(o.a?o.s:l,0,o.a?l:o.s);
  const dx=x-o.g.position.x,dz=z-o.g.position.z;if(dx*dx+dz*dz<7.5){hit(Math.min(25,Math.abs(v)*.8+3));x+=dx*.3;z+=dz*.3}});
 coins.forEach(c=>{c.rotation.y+=dt*3;if((c.position.x-x)**2+(c.position.z-z)**2<7){score+=10;got++;place(c)}});
 if(hp<=0){hp=100;x=0;z=-40;h=0;v=0;score=Math.max(0,score-20)}
 // leopard follows
 const tx=x-Math.sin(h)*7+Math.cos(h)*5,tz=z-Math.cos(h)*7-Math.sin(h)*5,dx=tx-lp.position.x,dz=tz-lp.position.z,d=Math.hypot(dx,dz),s=Math.min(d*2,32);
 if(d>.5){lp.position.x+=dx/d*s*dt;lp.position.z+=dz/d*s*dt;lp.rotation.y=Math.atan2(dx,dz)}
 legs.forEach((l,i)=>l.rotation.x=Math.sin(ph*s*.5+i*1.6)*Math.min(s/10,.8));
 // stats
 const kmh=Math.abs(v)*3.6,rx=((x%60)+60)%60,rz=((z%60)+60)%60;
 const on=(Math.min(rx,60-rx)<6&&Math.abs(z)<370)||(Math.min(rz,60-rz)<6&&Math.abs(x)<370)||(z>=370&&Math.abs(x)<6);
 foc=Math.max(0,Math.min(100,foc+(on?10:-15)*dt));
 const W=(n,p)=>document.getElementById('sb'+n).style.width=Math.max(0,Math.min(100,p))+'%';
 W('Strength',hp);W('Speed',kmh/2.3);W('Focus',foc);W('Success',got*4);
 sc.textContent='⭐ '+score;
 // minimap (north = +z up)
 mg.fillStyle='#1b2a1b';mg.fillRect(0,0,100,100);mg.strokeStyle='#666';mg.beginPath();
 for(let i=-5;i<=5;i++){const px=50-(i*60-x)/7,py=50-(i*60-z)/7;mg.moveTo(px,0);mg.lineTo(px,100);mg.moveTo(0,py);mg.lineTo(100,py)}mg.stroke();
 const dot=(wx,wz,c)=>{mg.fillStyle=c;mg.fillRect(48-(wx-x)/7,48-(wz-z)/7,4,4)};
 coins.forEach(c=>dot(c.position.x,c.position.z,'#ffd43b'));if(lp.visible)dot(lp.position.x,lp.position.z,'#ff922b');
 tr.forEach(o=>dot(o.g.position.x,o.g.position.z,'#fa5252'));dot(x,z,'#fff')}
/* ---------- physics + loop ---------- */
let x=0,z=-40,h=0,v=0,st=0,rpm=900,gear=1;
const lim=[40,75,110,145,230],clock=new THREE.Clock(),V=THREE.Vector3;
function loop(){
 requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05)*(paused?0:1);
 const gas=k.KeyW||k.ArrowUp||T.g,brk=k.KeyS||k.ArrowDown||T.b,L=k.KeyA||k.ArrowLeft||T.l,Rt=k.KeyD||k.ArrowRight||T.r;
 let a=0;
 if(gas)a=15*(1-Math.max(v,0)/62);
 if(brk)a=v>.5?-30:-7;
 if(k.Space)a-=45*Math.sign(v);
 a-=v*.12+Math.sign(v)*1.2;
 const nv=v+a*dt;v=(!gas&&!brk&&Math.abs(nv)<.4)?0:Math.max(-10,Math.min(62,nv));
 st+=((L?1:0)-(Rt?1:0)-st)*Math.min(1,dt*6);
 h+=(v/3)*Math.tan(st*.55/(1+Math.abs(v)/20))*dt;
 x+=Math.sin(h)*v*dt;z+=Math.cos(h)*v*dt;
 game(dt);car.position.set(x,0,z);car.rotation.y=h;car.rotation.z=-st*Math.min(Math.abs(v)/80,.12);
 wheels.forEach(w=>{w.spin.rotation.x+=v*dt/.48;if(w.front)w.piv.rotation.y=st*.5});
 const kmh=Math.abs(v)*3.6;let g=lim.findIndex(l=>kmh<l);if(g<0)g=4;
 const lo=g?lim[g-1]:0;rpm+=((v<-.5?1500+kmh*60:1000+(kmh-lo)/(lim[g]-lo)*5000+(gas?600:0))-rpm)*Math.min(1,dt*8);
 spd.textContent=Math.round(kmh);gr.textContent=v<-.5?'R':kmh<1?'N':g+1;rpmb.style.width=Math.min(100,rpm/70)+'%';
 if(ac){o1.frequency.value=rpm/30;o2.frequency.value=rpm/60;fl.frequency.value=400+rpm*.25;gn.gain.value=.05+(gas?.05:0)+rpm/200000}
 // cameras
 const f=new V(Math.sin(h),0,Math.cos(h));cam.up.set(0,1,0);car.updateMatrixWorld();drv.visible=cm!=2;
 let tp,lk;
 if(cm==0){tp=new V(x-f.x*9,3.8,z-f.z*9);lk=new V(x+f.x*6,1.6,z+f.z*6)}
 else if(cm==1){tp=car.localToWorld(new V(0,1.5,2.1));lk=car.localToWorld(new V(0,1.3,30))}
 else if(cm==2){tp=car.localToWorld(new V(.5,1.84,-.15));lk=car.localToWorld(new V(.5,1.7,30))}
 else if(cm==3){tp=new V(x,45,z);lk=new V(x,0,z);cam.up.set(f.x,0,f.z)}
